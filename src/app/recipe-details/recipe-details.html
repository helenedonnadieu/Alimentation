@if (recipe) {
  <div class="container padding-25">

    <div class="recipe-hero">
      <img [src]="recipe.img" [alt]="recipe.name">
      <div class="recipe-hero-info">
        <h2 class="titre">{{ recipe.name }}</h2>
      </div>
    </div>

    <div class="row padding-25">

      <div class="col-4">
        <div class="section-card">
          <p class="titre">Ingrédients</p>
          <p class="text-muted">Pour {{ recipe.servings }} portions</p>
          <ul class="ingredient-list">
            <li *ngFor="let ing of ingredients">
              <span class="ing-amount">{{ ing.amount | number:'1.0-1' }} {{ ing.unit }}</span>
              <span class="ing-name">{{ ing.name }}</span>
            </li>
          </ul>
        </div>
      </div>

      <div class="col-8">
        <div class="section-card">
          <p class="titre">Étapes de préparation</p>
          <div class="step" *ngFor="let step of steps">
            <div class="step-number">{{ step.number }}</div>
            <p class="step-text">{{ step.step }}</p>
          </div>
        </div>
      </div>

    </div>

  </div>
} @else {
  <div class="container padding-25 text-center">
    <p>Chargement de la recette...</p>
  </div>
}
